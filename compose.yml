# Full local dev stack: mongodb, redis, backend (5005), frontend (3000).
# Usage (repo root): docker compose up
# Override ports with DOCKER_*_PORT vars, e.g. docker compose --env-file backend/.env up
name: monkeytype

x-node: &node
  build:
    dockerfile_inline: |
      FROM node:24.11.0
      RUN npm i -g pnpm@11.21.0
      RUN mkdir /pnpm-store && chown -R 1000:1000 /pnpm-store
  image: monkeytype-dev-node
  user: "node" # works as long as your local user has uid=1000
  working_dir: /monkeytype
  volumes:
    - ./:/monkeytype
    - pnpm-store:/pnpm-store

services:
  redis:
    container_name: monkeytype-redis
    image: redis:6.2.6
    restart: on-failure
    ports:
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mongodb:
    container_name: monkeytype-mongodb
    image: mongo:5.0.13
    restart: on-failure
    ports:
      - "${DOCKER_DB_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  # installs deps once so backend and frontend don't race on node_modules
  install:
    <<: *node
    container_name: monkeytype-install
    entrypoint: >
      bash -c "echo installing dependencies, this may take a while...
      && pnpm i --store-dir /pnpm-store --config.confirm-modules-purge=false"

  api-server:
    <<: *node
    container_name: monkeytype-api-server
    restart: on-failure
    depends_on:
      install:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    environment:
      - DB_URI=mongodb://mongodb:27017
      - REDIS_URI=redis://redis:6379
    ports:
      - "${DOCKER_SERVER_PORT:-5005}:5005"
    entrypoint: bash -c "npm run dev-be"

  frontend:
    <<: *node
    container_name: monkeytype-frontend
    depends_on:
      install:
        condition: service_completed_successfully
    environment:
      - SERVER_OPEN=false
      - BACKEND_URL=http://localhost:${DOCKER_SERVER_PORT:-5005}
    ports:
      - "${DOCKER_HTTP_PORT:-3000}:3000"
    entrypoint: bash -c "npm run dev-fe"

volumes:
  mongo-data:
  redis-data:
  pnpm-store:
